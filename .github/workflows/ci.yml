name: Python CI

on:
  pull_request:
    branches:
      - main
      - dev

jobs:
  lint-and-test:
    name: Lint and test
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11"]

    steps:
      # Get the repository content
      - name: Checkout repository
        uses: actions/checkout@v4

      #Install uv
      - name: Install uv
        uses: astral-sh/setup-uv@v6

      # Install the right python versions
      - name: Install Python
        run: uv python install ${{ matrix.python-version }}

      - name: Create virtual environment
        run: uv venv --python ${{ matrix.python-version }}
      # Install dependencies
      - name: Install requirements
        run: |
          uv pip install --python .venv/bin/python -r requirements-dev.txt

      # Check code style
      - name: Run flake8
        run: .venv/bin/flake8 src

      # Check type annotations
      - name: Run mypy
        run: .venv/bin/mypy --warn-return-any --warn-unused-ignores --ignore-missing-imports --disallow-untyped-defs --check-untyped-defs src

      # Run unit tests
      - name: Run tests
        run: .venv/bin/pytest tests
